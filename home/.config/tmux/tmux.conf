# Claude Code Workspace — tmux configuration
# ~/.config/tmux → ~/dotfiles/home/.config/tmux （GNU stow で配置）

# ─── Prefix ─────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Terminal & Colors ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─── Behavior ────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
# 内側から OSC を外側の端末(WezTerm)へ素通しさせる。
# claude-layout.sh が WezTerm 窓を最大化する SetUserVar を送るのに必要。
set -g allow-passthrough on
setw -g mode-keys vi
set -g display-time 2000
set -g status-keys vi

# ─── キー一覧の自己文書化 ─────────────────────────────────────────────────────
# 自作バインドには必ず -N "◆ 説明" を付ける。理由:
#   - tmux の list-keys -N は「ノートが付いたキーだけ」を出す。ノート無しの自作キーは
#     一覧に一切現れず、prefix + ? を押しても tmux 標準キーしか出てこない。
#   - 目印 ◆ で「このハーネス独自」と「tmux 標準」を仕分けできる
#     （claude-keys.sh がこの ◆ を見て2セクションに分けて表示する）。
# → 新しい bind を足すときは -N も一緒に書くこと。書けば prefix + ? に自動で載る。

# ─── Reload ──────────────────────────────────────────────────────────────────
bind -N "◆ tmux 設定を再読込" r source-file ~/.config/tmux/tmux.conf \; display "✓ Config reloaded"

# ─── Pane Navigation (vim-style) ─────────────────────────────────────────────
bind -N "◆ ペイン移動: 左"  h select-pane -L
bind -N "◆ ペイン移動: 下"  j select-pane -D
bind -N "◆ ペイン移動: 上"  k select-pane -U
bind -N "◆ ペイン移動: 右"  l select-pane -R

# Ctrl+hjkl のペイン移動は廃止（移動は下の Alt+hjkl に一本化）。
# 理由: Shift+Enter が送る改行(LF)は Ctrl+J と同一バイトのため、この "C-j → 移動"
# がプロンプトの改行を横取りし「改行の代わりに下ペインへ移動」してしまっていた。

# Alt+hjkl で常にペイン移動（プレフィックスなし・vim/claude 中でも素通しせず必ず移動）
# 会話ビューア(left)↔claude(right) のペイン往復用。Claude は Alt+h/j/k/l を使わないので衝突なし。
bind -n -N "◆ ペイン移動: 左（prefix 不要）"  M-h select-pane -L
bind -n -N "◆ ペイン移動: 下（prefix 不要）"  M-j select-pane -D
bind -n -N "◆ ペイン移動: 上（prefix 不要）"  M-k select-pane -U
bind -n -N "◆ ペイン移動: 右（prefix 不要）"  M-l select-pane -R

# ─── Pane / Window Management ────────────────────────────────────────────────
bind -N "◆ ペインを縦に分割（現在パスを引き継ぐ）" | split-window -h -c "#{pane_current_path}"
bind -N "◆ ペインを横に分割（現在パスを引き継ぐ）" - split-window -v -c "#{pane_current_path}"
bind -N "◆ 新しいウィンドウ（現在パスを引き継ぐ）" c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r -N "◆ ペインサイズ変更: 左へ5（連打可）" H resize-pane -L 5
bind -r -N "◆ ペインサイズ変更: 下へ5（連打可）" J resize-pane -D 5
bind -r -N "◆ ペインサイズ変更: 上へ5（連打可）" K resize-pane -U 5
bind -r -N "◆ ペインサイズ変更: 右へ5（連打可）" L resize-pane -R 5
# ズーム = 他ペインが消える主犯。もう一度押せば必ず戻る（ズーム中は status に Z が出る）
bind -N "◆ ズーム: 1ペインを全画面 ⇔ 元に戻す（他ペインが消えたらこれ）" z resize-pane -Z

# Alt+N で直接ウィンドウジャンプ（プレフィックスなし）
bind -n -N "◆ ウィンドウ 1 へジャンプ（prefix 不要）" M-1 select-window -t :1
bind -n -N "◆ ウィンドウ 2 へジャンプ（prefix 不要）" M-2 select-window -t :2
bind -n -N "◆ ウィンドウ 3 へジャンプ（prefix 不要）" M-3 select-window -t :3
bind -n -N "◆ ウィンドウ 4 へジャンプ（prefix 不要）" M-4 select-window -t :4
bind -n -N "◆ ウィンドウ 5 へジャンプ（prefix 不要）" M-5 select-window -t :5
bind -n -N "◆ 前のウィンドウ（prefix 不要・飛んだペインを探すときにも）" M-p previous-window
bind -n -N "◆ 次のウィンドウ（prefix 不要・飛んだペインを探すときにも）" M-n next-window

# ─── Copy Mode ───────────────────────────────────────────────────────────────
bind -N "◆ コピーモード開始（vi キーでスクロール・選択）" Enter copy-mode
bind -T copy-mode-vi -N "◆ 選択開始"           v   send-keys -X begin-selection
bind -T copy-mode-vi -N "◆ 矩形選択に切替"      C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi -N "◆ コピーして終了（pbcopy）" y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi -N "◆ コピーモード終了"    Escape send-keys -X cancel

# ─── Claude Workspace ────────────────────────────────────────────────────────
# W: fzf でプロジェクトを選び、そのフォルダに claude 作業場を1つ作る
#    （左=会話ログ / 右上=新claude / 右下=shell）。今の作業は止めず、別タスク用の
#    claude を増やす（wezターム再起動が不要）。候補は claude-sessionizer.sh を参照。
bind -N "◆ claude 作業場を作る: fzf でプロジェクトを選ぶ（左=会話ログ/右上=claude/右下=shell）" \
  W display-popup -E -w 80% -h 80% "$HOME/.config/tmux/scripts/claude-sessionizer.sh"

# A: いまの会話の「続き」を会話ログmdに追記（Append・手編集は保持・nvimは自動反映）
#    （U は TPM のプラグイン更新が使用中のため A にしている）
bind -N "◆ いまの会話の続きを会話ログ md に追記（Append・手編集は保持）" \
  A run-shell "$HOME/.config/tmux/scripts/claude-log.sh --update"

# F: 関連ドキュメント(md)を fzf で選び、左ペインの nvim で開く（履歴と同じく閲覧・編集可）
#    左 nvim が --listen サーバなら --remote でバッファ追加、未起動なら左ペインを開き直す。
bind -N "◆ 関連ドキュメント(md)を fzf で選び、左ペインの nvim で開く" \
  F display-popup -E -w 80% -h 80% "$HOME/.config/tmux/scripts/claude-open-doc.sh"

# G: Git ログ
bind -N "◆ Git ログをグラフ表示" \
  G display-popup -w 80% -h 80% -d "#{pane_current_path}" \
  -E "git log --oneline --graph --color=always 2>/dev/null | head -80 | less -R"

# S: セッション切替 (fzf)
bind -N "◆ セッション切替（fzf）" \
  S display-popup -w 50% -h 40% \
  -E "tmux list-sessions | fzf --reverse --header 'セッション切替 (Enter)' \
      | cut -d: -f1 | xargs -r tmux switch-client -t"

# ? / q: キーバインド一覧（このハーネス独自を上に、tmux 標準を下に。fzf で絞り込み）
#    tmux 標準の ? は list-keys -N そのままで、ノートの無い自作キーが載らないため差し替える。
#    q は「?（Shift+/）が押しにくい」対策の別名。中身は同じ。
#    ※ q の tmux 既定は display-panes（ペイン番号の一時表示）。上書きして一覧に充てる。
bind -N "◆ キーバインド一覧を表示（この画面）／別名: q" \
  ? display-popup -E -w 80% -h 80% "$HOME/.config/tmux/scripts/claude-keys.sh"
bind -N "◆ キーバインド一覧を表示（この画面）／別名: ?" \
  q display-popup -E -w 80% -h 80% "$HOME/.config/tmux/scripts/claude-keys.sh"

# ─── Status Bar ── Catppuccin Mocha ──────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

set -g status-style          "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length    25
set -g status-right-length   90

set -g status-left  "#[bg=#cba6f7,fg=#1e1e2e,bold] #{session_name} #[bg=#1e1e2e,fg=#cba6f7] "
set -g status-right "#[fg=#45475a] #{b:pane_current_path} #[fg=#585b70]│ %m/%d %H:%M #[fg=#cba6f7]│ #[fg=#cba6f7,bold]#h "

# #{?window_zoomed_flag,...} = ズーム中バッジ。prefix + z の誤爆で「ペインが消えた」ときに
# ここに Z が出るので、消えたのではなくズームだと即わかる（もう一度 z で戻る）。
setw -g window-status-format         "#[fg=#45475a,bg=#1e1e2e] #I:#W#{?window_zoomed_flag,#[fg=#f9e2af]Z,} "
# ※ #{?...} の中でカンマは分岐の区切りとして解釈される。#[fg=…,bold] のように
#   カンマを含む style は書けない（描画が壊れる）ので、bold は前段から引き継がせる。
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag,#[fg=#f9e2af] Z,} #[fg=#313244,bg=#1e1e2e] "
setw -g window-status-separator      ""

set -g message-style         "bg=#f9e2af,fg=#1e1e2e,bold"
set -g message-command-style "bg=#f9e2af,fg=#1e1e2e"
# どのペインにいるかを枠線だけで判別する。
#   - heavy は「全ペインの枠」が太線になる（アクティブだけ太くはならない）。
#     判別はあくまで色。太いぶん色が広く出るので、細線より格段に見分けやすい。
#   - アクティブに接する枠だけが pane-active-border-style で描かれる（tmux が辺ごとに判定）。
#   - 黄色にしたのは、UI の他のアクセント（紫 #cba6f7＝セッション名・カレントウィンドウ）と
#     被らせないため。非アクティブは背景に沈む暗さのまま据え置き＝コントラスト最大。
set -g pane-border-lines        heavy
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#f9e2af,bold"

# ─── Plugins (tpm) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
# 自動復元は OFF。これを 'on' にすると tmux 起動のたびに前回セッションを復元し、
# 以前 C-a W で作った3分割の作業場まで勝手に蘇って「起動しただけで3分割」になる。
# 作業場はあくまで C-a W を押したときだけ作る方針なので復元はしない。
# （手動で戻したいときは prefix + Ctrl-s 保存 / prefix + Ctrl-r 復元が使える）
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

# TPM は XDG 設定(~/.config/tmux/tmux.conf)を検出すると plugins を
# ~/.config/tmux/plugins/ に置く。ロード元もそこに合わせる（実体とズレ防止）。
# プラグイン本体は .gitignore で非追跡（TPM で再生成可能）。
if-shell "test -f ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
